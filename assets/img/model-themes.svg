<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="mt-title mt-desc">
  <title id="mt-title">访谈主题模型</title>
  <desc id="mt-desc">以睡前屏幕依赖为中心，连接熬夜与拖延、屏幕与环境、工具与授权三组主题。</desc>
  <defs>
    <radialGradient id="mt-core" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8ab4ff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8ab4ff" stop-opacity="0.06"/>
    </radialGradient>
    <style>
      .node{fill:rgba(255,255,255,0.045);stroke:rgba(150,175,255,0.28);stroke-width:1.5}
      .core{fill:url(#mt-core);stroke:#8ab4ff;stroke-opacity:0.55;stroke-width:1.6}
      .edge{stroke:#8ab4ff;stroke-opacity:0.32;stroke-width:1.5;stroke-dasharray:6 6}
      .tag{fill:#8ab4ff;font:600 12px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;letter-spacing:2px}
      .ttl{fill:#e8edff;font:600 19px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif}
      .desc{fill:#9fb0d8;font:400 12.5px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif}
      .core-ttl{fill:#dfe8ff;font:600 17px 'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif}
    </style>
  </defs>

  <!-- 连线 -->
  <line class="edge" x1="322" y1="138" x2="404" y2="222"/>
  <line class="edge" x1="322" y1="382" x2="404" y2="298"/>
  <line class="edge" x1="606" y1="260" x2="516" y2="260"/>

  <!-- 核心 -->
  <circle class="core" cx="460" cy="260" r="88"/>
  <text class="core-ttl" x="460" y="252" text-anchor="middle">睡前屏幕依赖</text>
  <text class="desc" x="460" y="278" text-anchor="middle">刷不完 → 睡不着 → 更晚起</text>

  <!-- 主题一 -->
  <rect class="node" x="70" y="90" width="252" height="100" rx="16"/>
  <text class="tag" x="94" y="122">主题一</text>
  <text class="ttl" x="94" y="150">熬夜与拖延</text>
  <text class="desc" x="94" y="173">情境 · 心理 · 触发因素</text>

  <!-- 主题二 -->
  <rect class="node" x="70" y="332" width="252" height="100" rx="16"/>
  <text class="tag" x="94" y="364">主题二</text>
  <text class="ttl" x="94" y="392">屏幕与环境</text>
  <text class="desc" x="94" y="415">内容 · 光线 · 身体信号</text>

  <!-- 主题三 -->
  <rect class="node" x="606" y="210" width="252" height="100" rx="16"/>
  <text class="tag" x="630" y="242">主题三</text>
  <text class="ttl" x="630" y="270">工具与授权</text>
  <text class="desc" x="630" y="293">现有方案 · APP 期待 · 隐私</text>
</svg>
